name: Build Validation & Code Quality

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  validate:
    name: Code Quality & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Gradle Dependencies
        run: gradle dependencies --no-daemon

      - name: Run Android Lint Check
        run: gradle lintDebug --no-daemon

      - name: Run JVM Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Verify Clean Compilation
        run: gradle compileDebugSources --no-daemon
