name: Build Debug APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Print Java & Gradle Version
        run: |
          java -version
          gradle -v

      - name: Resolve Dependencies
        run: gradle dependencies --no-daemon

      - name: Run Android Lint
        run: gradle lintDebug --no-daemon

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Verify Debug APK
        run: |
          echo "Verifying Debug APK output..."
          ls -la app/build/outputs/apk/debug/
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            echo "APK Size: $(du -h "$APK_PATH" | cut -f1)"
          else
            echo "Error: Debug APK file not found!"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hisab-tracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
