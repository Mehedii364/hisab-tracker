name: Android CI/CD Build & Release

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  build:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Environment File
        run: |
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Decode & Prepare Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "Keystore decoded successfully from secrets."
          else
            echo "KEYSTORE_BASE64 secret is not set. Generating fallback upload key for build verification..."
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${{ secrets.STORE_PASSWORD || 'placeholderpass' }}" \
              -keypass "${{ secrets.KEY_PASSWORD || 'placeholderpass' }}" \
              -dname "CN=HisabTracker,OU=Android,O=Dev,L=City,S=State,C=US"
          fi

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Run Android Lint
        run: gradle lintDebug --no-daemon

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'placeholderpass' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'placeholderpass' }}
        run: gradle assembleRelease --no-daemon

      - name: Build Release Android App Bundle (AAB)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'placeholderpass' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'placeholderpass' }}
        run: gradle bundleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14
