name: Build & Release Production APK / AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build Signed Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode & Prepare Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "Release keystore decoded successfully."
          else
            echo "Notice: ANDROID_KEYSTORE_BASE64 secret not set. Generating release keystore for build testing..."
            keytool -genkeypair -v -keystore release.keystore -alias releaseKey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'hisabpass' }}" \
              -keypass "${{ secrets.ANDROID_KEY_PASSWORD || 'hisabpass' }}" \
              -dname "CN=HisabTracker,OU=Fintech,O=Hisab,L=Dhaka,S=Dhaka,C=BD"
          fi

      - name: Build Release APK
        env:
          STORE_FILE: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'hisabpass' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'releaseKey' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'hisabpass' }}
        run: gradle assembleRelease --no-daemon

      - name: Build Release AAB (App Bundle)
        env:
          STORE_FILE: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'hisabpass' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'releaseKey' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'hisabpass' }}
        run: gradle bundleRelease --no-daemon

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hisab-Tracker-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hisab-Tracker-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14
